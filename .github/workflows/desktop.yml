name: Windows desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Install capture browser
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH="$PWD\.browsers"
          npx playwright install chromium
      - run: npm run desktop:build
      - name: Test packaged app
        shell: pwsh
        run: |
          $isolated=Join-Path $env:RUNNER_TEMP 'sourcewatch-isolated'
          Copy-Item release/win-unpacked $isolated -Recurse
          $env:SOURCEWATCH_TEST_EXECUTABLE=Join-Path $isolated 'SourceWatch.exe'
          npx tsx scripts/smoke-desktop.ts
      - name: Test portable extraction and startup
        run: npx tsx scripts/smoke-portable.ts
      - uses: actions/upload-artifact@v4
        with:
          name: sourcewatch-windows
          path: release/*.exe
